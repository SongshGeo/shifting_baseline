[project]
name = "shifting_baseline"
version = "0.1.0"
description = "Detecting Shifting Baseline Syndrome (SBS) behind data."
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [
    { name = "SongshGeo", email = "songshgeo@gmail.com" },
]
dependencies = [
    "abses>=0.7.5",
    "arviz>=0.20.0,<0.21.0",
    "cartopy>=0.24.1",
    "cf-xarray",
    "cftime>=1.6.4.post1",
    "fitter>=1.7.1,<2.0.0",
    "GeoDSKit>=0.2.0",
    "geopandas",
    "hydra-core>=1.3,<1.4",
    "json-tricks>=3.17.3,<4.0.0",
    "matplotlib>=3.9.2",
    "matplotkit>=0.1.0",
    "mksci-font>=0.1.3",
    "nc-time-axis>=1.4",
    "netcdf4>=1.7",
    "numpy",
    "omegaconf",
    "openpyxl",
    "pandas",
    "pint-xarray>=0.4",
    "psutil",
    "pymc>=5.20.1,<6.0.0",
    "pyproj",
    "python-dotenv>=1.1.1,<2.0.0",
    "rioxarray>=0.17.0",
    "salib>=1.5.1",
    "scikit-learn",
    "scipy",
    "seaborn>=0.13.2,<0.14.0",
    "setuptools<81",
    "statsmodels",
    "tqdm",
    "xarray>=2023",
    "xclim>=0.53.2,<0.54.0",
]

[dependency-groups]
dev = [
    "allure-pytest>=2.13.5,<3.0.0",
    "ipykernel>=6.29.5,<7.0.0",
    "ipywidgets>=8.1.5,<9.0.0",
    "pytest>=8.3.3,<9.0.0",
    "pytest-clarity>=1.0.1,<2.0.0",
    "pytest-sugar>=1.0.0,<2.0.0",
]
docs = [
    "mkdocs>=1.6.1,<2.0.0",
    "mkdocs-awesome-pages-plugin>=2.10.1,<3.0.0",
    "mkdocs-bibtex>=4.4.0,<5.0.0",
    "mkdocs-callouts>=1.16.0,<2.0.0",
    "mkdocs-git-authors-plugin>=0.10.0,<0.11.0",
    "mkdocs-git-revision-date-localized-plugin>=1.4.7,<2.0.0",
    "mkdocs-glightbox>=0.5.1,<0.6.0",
    "mkdocs-jupyter>=0.25.1,<0.26.0",
    "mkdocs-macros-plugin>=1.3.9,<2.0.0",
    "mkdocs-material>=9.6.19,<10.0.0",
    "mkdocs-minify-plugin>=0.8.0,<0.9.0",
    "mkdocs-redirects>=1.2.2,<2.0.0",
    "mkdocstrings[python]>=0.30.0,<0.31.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow-running",
]

[tool.hatch.build.targets.wheel]
packages = ["shifting_baseline"]

[tool.hatch.build.targets.sdist]
include = [
    "/config",
    "/shifting_baseline",
    "/README.md",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
