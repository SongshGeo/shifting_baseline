# ABM 模型配置
mode: 'exp'
repeats: 100  # 每组参数的运行重复次数
num_process: 5  # 并行运算的进程数

# 模型参数
years: 100
max_age: 40
loss_rate: 0.4
new_agents: 5
min_age: 10
memory_baseline: "personal"
step_per_year: 1
subannual_aggregation: "mean"  # mean, sum, last
climate_process: "ar1"  # 主分析用 AR(1)（与正文/图5一致）; 可选 iid, trend_plus_noise, ar1_trend
climate_sigma: 1.0
climate_phi: 0.5
climate_trend: 0.0

# 相关性计算参数
min_period: ${min_period}
corr_method: ${corr_method}
filter_side: ${filter_side}
